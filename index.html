<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1026" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Salpicón" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Salpicón</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f4f4f8;
        --sky: #0b1026;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--sky);
        color: var(--ink);
        font-family: "Press Start 2P", ui-monospace, "Courier New", monospace;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #app canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }
      /* "rotate your phone" — the game is a 16:9 landscape shooter */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        text-align: center;
        background: radial-gradient(120% 90% at 50% 0%, #1a2a6c 0%, #0b1026 60%, #05060f 100%);
      }
      #rotate .ph {
        width: 78px;
        height: 132px;
        border: 6px solid #ffd447;
        border-radius: 14px;
        animation: tilt 1.6s ease-in-out infinite;
      }
      #rotate p { font-size: 11px; line-height: 1.8; color: #ffd447; margin: 0; }
      #rotate span { display: block; font-size: 8px; color: #9aa7d0; margin-top: 6px; }
      @keyframes tilt {
        0%, 40% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (max-width: 900px) and (orientation: portrait) {
        #rotate { display: flex; }
      }
      /* Boot splash shown until Phaser paints */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        background:
          radial-gradient(120% 90% at 50% 0%, #1a2a6c 0%, #0b1026 60%, #05060f 100%);
        z-index: 10;
        transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash h1 {
        font-size: clamp(18px, 5vw, 34px);
        letter-spacing: 2px;
        margin: 0;
        color: #ffd447;
        text-shadow: 4px 4px 0 #b5451b;
      }
      #splash p { font-size: 10px; color: #9aa7d0; margin: 0; }
      .dots::after {
        content: "";
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash">
      <h1>SALPICON</h1>
      <p class="dots">cargando</p>
    </div>
    <div id="rotate">
      <div class="ph"></div>
      <p>GIRA TU DISPOSITIVO<span>Salpicón se juega en horizontal</span></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
