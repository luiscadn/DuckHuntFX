<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1026" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%235ec8f2'/%3E%3Ccircle cx='10' cy='6' r='3' fill='%231f7a3f'/%3E%3Crect x='12' y='5' width='4' height='2' fill='%23f2a416'/%3E%3Cellipse cx='7' cy='9' rx='5' ry='3' fill='%23f2f0e4'/%3E%3C/svg%3E"
    />
    <title>Salpicón</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f4f4f8;
        --sky: #0b1026;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--sky);
        color: var(--ink);
        font-family: "Press Start 2P", ui-monospace, "Courier New", monospace;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #app canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }
      /* Boot splash shown until Phaser paints */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        background:
          radial-gradient(120% 90% at 50% 0%, #1a2a6c 0%, #0b1026 60%, #05060f 100%);
        z-index: 10;
        transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash h1 {
        font-size: clamp(18px, 5vw, 34px);
        letter-spacing: 2px;
        margin: 0;
        color: #ffd447;
        text-shadow: 4px 4px 0 #b5451b;
      }
      #splash p { font-size: 10px; color: #9aa7d0; margin: 0; }
      .dots::after {
        content: "";
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash">
      <h1>SALPICON</h1>
      <p class="dots">cargando</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
